---
# Override these with extra vars when provisioning on a specific AAP instance.
aap_organization: Default
aap_project_name: AWS EC2 Operational Tasks
aap_git_repo: https://github.com/ansible-tmm/aws_ec2_operational_tasks
aap_git_branch: main
aap_inventory_name: AWS EC2 Operational Tasks Inventory
aap_aws_credential_name: AWS -sean

missing_tag_job_template_name: AWS | EC2 | Missing Owner Tag
missing_tag_workflow_name: AWS | EC2 | Enforce Owner Tag | All Regions

sleep_schedule_on_job_template_name: AWS | EC2 | Sleep Schedule On
sleep_schedule_off_job_template_name: AWS | EC2 | Sleep Schedule Off
sleep_schedule_on_workflow_name: AWS | EC2 | Sleep Schedule On | All Regions
sleep_schedule_off_workflow_name: AWS | EC2 | Sleep Schedule Off | All Regions

# Weekday schedules (Monday-Friday). Override times or timezone with extra vars.
sleep_schedule_timezone: America/New_York
sleep_schedule_dtstart_anchor: "2025-07-07"
sleep_schedule_on_time: "06:00:00"
sleep_schedule_off_time: "18:00:00"
sleep_schedule_weekdays: monday,tuesday,wednesday,thursday,friday
sleep_schedule_weekday_byday: MO,TU,WE,TH,FR

aws_regions:
  # Americas
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - ca-central-1
  - sa-east-1
  # Europe
  - eu-west-1
  - eu-west-2
  - eu-west-3
  - eu-central-1
  - eu-north-1
  # Asia Pacific
  - ap-northeast-1
  - ap-northeast-2
  - ap-northeast-3
  - ap-south-1
  - ap-southeast-1
  - ap-southeast-2

aap_job_templates:
  - name: "{{ missing_tag_job_template_name }}"
    playbook: playbooks/missing_tag.yaml
  - name: "{{ sleep_schedule_on_job_template_name }}"
    playbook: playbooks/sleep_schedule_on.yaml
  - name: "{{ sleep_schedule_off_job_template_name }}"
    playbook: playbooks/sleep_schedule_off.yaml

aap_workflows:
  - name: "{{ missing_tag_workflow_name }}"
    description: >-
      Stop running EC2 instances missing the owner tag across AWS regions in
      parallel.
    job_template: "{{ missing_tag_job_template_name }}"
  - name: "{{ sleep_schedule_on_workflow_name }}"
    description: >-
      Start stopped EC2 instances tagged sleep_schedule across AWS regions in
      parallel.
    job_template: "{{ sleep_schedule_on_job_template_name }}"
  - name: "{{ sleep_schedule_off_workflow_name }}"
    description: >-
      Stop running EC2 instances tagged sleep_schedule across AWS regions in
      parallel.
    job_template: "{{ sleep_schedule_off_job_template_name }}"

aap_schedules:
  - name: "{{ sleep_schedule_on_workflow_name }} | Weekdays"
    description: >-
      Start sleep_schedule tagged instances at {{ sleep_schedule_on_time }}
      Monday-Friday ({{ sleep_schedule_timezone }}).
    unified_job_template: "{{ sleep_schedule_on_workflow_name }}"
    organization: "{{ aap_organization }}"
    enabled: true
    rrule: >-
      DTSTART;TZID={{ sleep_schedule_timezone }}:{{ sleep_schedule_dtstart_anchor | replace('-', '') }}T{{ sleep_schedule_on_time | replace(':', '') }}
      RRULE:FREQ=WEEKLY;INTERVAL=1;BYDAY={{ sleep_schedule_weekday_byday }}
  - name: "{{ sleep_schedule_off_workflow_name }} | Weekdays"
    description: >-
      Stop sleep_schedule tagged instances at {{ sleep_schedule_off_time }}
      Monday-Friday ({{ sleep_schedule_timezone }}).
    unified_job_template: "{{ sleep_schedule_off_workflow_name }}"
    organization: "{{ aap_organization }}"
    enabled: true
    rrule: >-
      DTSTART;TZID={{ sleep_schedule_timezone }}:{{ sleep_schedule_dtstart_anchor | replace('-', '') }}T{{ sleep_schedule_off_time | replace(':', '') }}
      RRULE:FREQ=WEEKLY;INTERVAL=1;BYDAY={{ sleep_schedule_weekday_byday }}

user_message: >-
  AWS EC2 Operational Tasks demo provisioned. Launch the
  "{{ missing_tag_workflow_name }}" workflow to stop instances missing the owner
  tag across all configured AWS regions in parallel. Sleep schedule workflows
  "{{ sleep_schedule_on_workflow_name }}" and
  "{{ sleep_schedule_off_workflow_name }}" run automatically Monday-Friday at
  {{ sleep_schedule_on_time }} and {{ sleep_schedule_off_time }}
  ({{ sleep_schedule_timezone }}). Ensure an AWS credential named
  "{{ aap_aws_credential_name }}" exists in the "{{ aap_organization }}"
  organization before running jobs.

controller_inventories:
  - name: "{{ aap_inventory_name }}"
    organization: "{{ aap_organization }}"
    description: Localhost inventory for AWS API playbooks

controller_hosts:
  - name: localhost
    inventory: "{{ aap_inventory_name }}"
    variables:
      ansible_connection: local

controller_projects:
  - name: "{{ aap_project_name }}"
    organization: "{{ aap_organization }}"
    scm_type: git
    scm_url: "{{ aap_git_repo }}"
    scm_branch: "{{ aap_git_branch }}"
    scm_update_on_launch: true

controller_templates:
  - name: "{{ missing_tag_job_template_name }}"
    job_type: run
    organization: "{{ aap_organization }}"
    credentials:
      - "{{ aap_aws_credential_name }}"
    project: "{{ aap_project_name }}"
    playbook: playbooks/missing_tag.yaml
    inventory: "{{ aap_inventory_name }}"
    allow_simultaneous: true
    ask_variables_on_launch: true

controller_workflows:
  - name: "{{ missing_tag_workflow_name }}"
    description: >-
      Stop running EC2 instances missing the owner tag across AWS regions in
      parallel.
    organization: "{{ aap_organization }}"
